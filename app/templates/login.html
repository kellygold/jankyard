{% extends "base.html" %}

{% block title %}Login - Jankyard.ai{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>🔐 Login</h1>
        <p class="subtitle">Welcome back to the Jankyard</p>

        <div id="error-message" class="error-message" style="display: none;"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>
        <div id="loading-message" class="loading-message" style="display: none;">
            ⏳ This may take a sec... (waking up the database)
        </div>

        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary">
                Login
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Sign up</a></p>
            <p class="text-muted">Or continue as <a href="/challenges">anonymous</a></p>
        </div>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 2rem 0;
}

.auth-box {
    background: #1a1a1a;
    border: 2px solid #00ff00;
    border-radius: 8px;
    padding: 3rem;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
}

.auth-box h1 {
    text-align: center;
    color: #00ff00;
    margin-bottom: 0.5rem;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 2rem;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-group label {
    color: #00ff00;
    font-weight: 600;
    font-size: 0.9rem;
}

.form-group input {
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 0.75rem;
    color: #fff;
    font-size: 1rem;
    transition: border-color 0.3s;
}

.form-group input:focus {
    outline: none;
    border-color: #00ff00;
    box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
}

.btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.3s;
}

.btn-primary {
    background: #00ff00;
    color: #000;
}

.btn-primary:hover {
    background: #00cc00;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0, 255, 0, 0.4);
}

.auth-footer {
    margin-top: 2rem;
    text-align: center;
    color: #888;
}

.auth-footer a {
    color: #00ff00;
    text-decoration: none;
}

.auth-footer a:hover {
    text-decoration: underline;
}

.text-muted {
    font-size: 0.9rem;
    margin-top: 0.5rem;
}

.error-message {
    background: rgba(255, 0, 0, 0.1);
    border: 1px solid #ff0000;
    color: #ff6666;
    padding: 1rem;
    border-radius: 4px;
    margin-bottom: 1rem;
}

.success-message {
    background-color: rgba(63, 185, 80, 0.1);
    border: 1px solid #3fb950;
    color: #3fb950;
    padding: 0.75rem;
    border-radius: 4px;
    margin-bottom: 1rem;
}

.loading-message {
    background-color: rgba(88, 166, 255, 0.1);
    border: 1px solid #58a6ff;
    color: #58a6ff;
    padding: 0.75rem;
    border-radius: 4px;
    margin-bottom: 1rem;
    text-align: center;
    font-style: italic;
}
</style>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    const loadingDiv = document.getElementById('loading-message');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    loadingDiv.style.display = 'none';
    
    // Disable submit button
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    
    // Show loading message after 1.5 seconds
    const loadingTimeout = setTimeout(() => {
        loadingDiv.style.display = 'block';
    }, 1500);
    
    const formData = new FormData();
    formData.append('username', username);
    formData.append('password', password);
    
    try {
        const response = await fetch('/auth/token', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Store token in localStorage
            localStorage.setItem('access_token', data.access_token);
            
            successDiv.textContent = 'Login successful! Redirecting...';
            successDiv.style.display = 'block';
            
            // Redirect after short delay
            setTimeout(() => {
                window.location.href = '/challenges';
            }, 1000);
        } else {
            errorDiv.textContent = data.detail || 'Login failed. Please check your credentials.';
            errorDiv.style.display = 'block';
        }
    } catch (error) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.style.display = 'block';
    } finally {
        // Clear loading state
        clearTimeout(loadingTimeout);
        loadingDiv.style.display = 'none';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
    }
});
</script>
{% endblock %}
