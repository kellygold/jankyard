[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live_model: Opt-in paid model experiments
    api: Backend API tests
    e2e: End-to-end browser tests
    slow: Tests that take a long time
    level_progression: Tests for level unlock functionality
    leaderboard: Tests for leaderboard publishing
addopts = -v --tb=short
