name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Python syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/challenges/*.py
          echo "✅ No syntax errors"
      
      - name: Check imports
        run: |
          python -c "from app.challenges.registry import ChallengeRegistry; print(f'✅ Found {len(ChallengeRegistry.get_all())} challenges')"
